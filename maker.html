<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꿀꿀이 등록증</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위는 만들기 도구, 아래는 저금통 바닥에 붙일 스티커 한 장 */
:root {
  --bg: #FFF1F4; --surface: #FFFFFF; --line: #F2D3DB; --ink: #4A2230; --muted: #92606F; --accent: #C2456A; --accent-ink: #FFFFFF; --pink: #F6A9BB;
  --f-display: "Jua", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 520px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input { flex: 1; min-width: 0; height: 46px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; font: 16px var(--f-mono); color: var(--ink); background: #FFFDF6; }
button { height: 46px; border-radius: 12px; border: 0; padding: 0 16px; font-family: var(--f-display); font-size: 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
pre { margin: 0; background: #2B1820; color: #FBE8EE; border-radius: 12px; padding: 12px 14px; font: 14px var(--f-mono); overflow-x: auto; }
.sticker { align-self: center; width: 260px; max-width: 100%; background: #FFFFFF; color: #4A2230; border: 2px dashed var(--pink); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sticker b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.sticker .qr { width: 200px; height: 200px; }
.sticker .qr svg { width: 100%; height: 100%; display: block; }
.sticker code { font: 17px var(--f-mono); letter-spacing: 1px; }
.sticker small { font-size: 12px; color: #92606F; }
.url { font: 12px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>꿀꿀이 등록증 만들기</h1>
    <p class="muted">저금통 한 대마다 코드 하나를 만들어요. 아래 스티커는 저금통 바닥에 붙이고, 코드 줄은 아두이노 코드에 붙여넣어요.</p>
  </div>

  <div class="card">
    <div class="row">
      <input id="inId" aria-label="꿀꿀이 코드" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="새 코드 만들기를 눌러요">
      <button id="btnNew">새 코드 만들기</button>
    </div>
    <p class="muted">이미 만든 코드가 있으면 칸에 직접 넣어도 돼요. 코드는 영문 소문자·숫자 12자리예요.</p>
  </div>

  <div class="sticker" id="sticker">
    <b>꿀꿀은행</b>
    <div class="qr" id="qr"></div>
    <code id="pretty">----</code>
    <small>카메라로 찍고 로그인하면 연결돼요</small>
  </div>
  <p class="url" id="url"></p>

  <div class="card">
    <p><b style="font-family:var(--f-display);font-weight:400;font-size:18px">아두이노 코드에 붙여넣을 줄</b></p>
    <pre id="line">#define DEVICE_ID "------------"</pre>
    <div class="row"><button class="ghost" id="btnCopy">이 줄 복사</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const ABC = 'abcdefghjkmnpqrstuvwxyz23456789';
  const $ = id => document.getElementById(id);
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const pretty = s => s.replace(/(.{4})(?=.)/g, '$1-');
  const base = location.href.split('#')[0].split('?')[0].replace(/maker\.html$/, '');

  function newId() {
    const a = new Uint32Array(12); crypto.getRandomValues(a);
    return Array.from(a, n => ABC[n % ABC.length]).join('');
  }
  function draw(id) {
    const ok = /^[a-z0-9]{12}$/.test(id);
    $('pretty').textContent = ok ? pretty(id) : '----';
    $('line').textContent = `#define DEVICE_ID "${ok ? id : '------------'}"`;
    const url = base + '?pig=' + id;
    $('url').textContent = ok ? 'QR 주소: ' + url : '';
    $('qr').textContent = '';
    if (ok && window.qrcode) {
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      $('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }
  }
  $('btnNew').addEventListener('click', () => { const id = newId(); $('inId').value = id; draw(id); });
  $('inId').addEventListener('input', () => draw(norm($('inId').value)));
  $('btnCopy').addEventListener('click', () => {
    const t = $('line').textContent;
    try { navigator.clipboard.writeText(t); } catch (e) {}
  });
  const first = newId(); $('inId').value = first; draw(first);
})();
</script>
</body>
</html>
